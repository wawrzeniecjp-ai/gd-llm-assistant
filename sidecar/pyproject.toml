[project]
name = "gd-ai-assistant-sidecar"
version = "0.1.0"
description = "Local sidecar for the GD AI Assistant Geode mod: authenticated WebSocket server, LLM tool loop, session store."
requires-python = ">=3.11"
dependencies = [
    "websockets>=14.0",
    "pydantic-settings>=2.6",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "anthropic>=0.40",
    "openai>=1.55",
]

[project.scripts]
gd-ai-assistant-sidecar = "gd_ai_assistant.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gd_ai_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
