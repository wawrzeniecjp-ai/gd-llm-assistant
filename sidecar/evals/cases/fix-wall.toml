id = "fix-wall"
description = "An impossible wall; fix it with few changes."
fixture = "wall-1x"
prompt = "The section from column 10 to column 40 can't be beaten. Fix it with as few changes as possible."
section = [0, 1500]

[assert.hard]
status = "completed"
edited = true
playable = "possible"
verified_after_last_edit = true

[assert.soft]
objects_deleted = { max = 6 }
objects_created = { max = 6 }
