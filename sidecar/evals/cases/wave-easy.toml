id = "wave-easy"
description = "M5: an easy wave section; the wave dies on any block it touches."
fixture = "empty"
prompt = """
Make an easy wave part from column 10 to column 50 at 1x, with a few spikes and blocks to
weave between, then back to the cube. Make sure it is playable.
"""
section = [0, 1650]

[assert.hard]
status = "completed"
edited = true
playable = "possible"
verified_after_last_edit = true

[assert.soft]
"portals_created.wave" = { between = [1, 1] }
exit_mode = "cube"
min_window_ms = { min = 40 }
frame_perfect = 0
